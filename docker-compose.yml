services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
    networks:
      - low-stim
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - low-stim
    depends_on:
      - app

  mariadb:
    image: mariadb:lts
    environment:
      MARIADB_DATABASE: low_stim_play
      MARIADB_USER: low_stim
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root_secret
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - low-stim
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    networks:
      - low-stim
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:listen --tries=1 --timeout=0
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    networks:
      - low-stim
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    networks:
      - low-stim
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:

networks:
  low-stim:
    driver: bridge
